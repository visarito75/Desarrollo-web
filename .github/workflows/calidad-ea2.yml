name: Calidad EA2
on:
  pull_request:
  push:
jobs:
  calidad:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EXAMEN_EA2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:project
      - run: npm test
